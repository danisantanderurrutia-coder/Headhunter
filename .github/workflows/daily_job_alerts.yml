name: "Daily Job Alerts Engine"

on:
  schedule:
    # 07:15 UTC = 09:15 CEST / 08:15 CET (Lunes a Viernes)
    - cron: '15 7 * * 1-5'
  workflow_dispatch: # Permite disparo manual desde la pestaña Actions de GitHub

permissions:
  contents: write

jobs:
  run-alerts:
    name: Ingest Jobs & Dispatch Morning Digest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Execute Multi-Category Job Scraper
        run: |
          python scripts/job_scraper.py --category all

      - name: Commit Updated jobs.json (Git-Scraping)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add public/data/jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update jobs.json [skip ci]" && git push)
        continue-on-error: true

      - name: Dispatch Daily Job Digest
        env:
          ENABLE_JOB_ALERTS: ${{ vars.ENABLE_JOB_ALERTS || 'true' }}
          ALERT_RECIPIENT_EMAIL: ${{ secrets.ALERT_RECIPIENT_EMAIL || 'danisantander.urrutia@gmail.com' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'danisantander.urrutia@gmail.com' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/daily_job_alerts.py --force-send

      - name: Upload HTML Digest Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latest-job-digest
          path: scripts/latest_job_digest.html
          retention-days: 7
